<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toast Notifications · 吐司通知</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hud-actions">
    <div class="hud-brand">
      <span class="hud-dot"></span>
      <span class="hud-title">Toast · 吐司通知</span>
    </div>
  </div>

  <main class="page-container">
    <header class="page-header">
      <span class="eyebrow">NATIVE COMPONENT · NOTIFICATION SYSTEM</span>
      <h1>不打扰，是我的温柔</h1>
      <p>点击下方按钮触发不同类型的通知，它们会在右上角依次堆叠，底部进度条实时显示剩余时间。悬停暂停倒计时，操作按钮可立即处理对应事件。</p>
    </header>

    <section class="control-panel">
      <p class="panel-caption">选择要触发的通知类型</p>
      <div class="trigger-grid">
        <button type="button" class="trigger-btn t-success" data-type="success">
          <span class="btn-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path d="m4 12.5 5 5L20 6.5"></path>
            </svg>
          </span>
          <span class="btn-text">
            <strong>成功</strong>
            <small>保存完成提示</small>
          </span>
        </button>

        <button type="button" class="trigger-btn t-info" data-type="info">
          <span class="btn-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M12 11v5.5M12 7.6v.2"></path>
            </svg>
          </span>
          <span class="btn-text">
            <strong>信息</strong>
            <small>新版本更新说明</small>
          </span>
        </button>

        <button type="button" class="trigger-btn t-warning" data-type="warning">
          <span class="btn-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path d="M12 3.5 2.5 20h19L12 3.5Z"></path>
              <path d="M12 10v4.5M12 17.4v.2"></path>
            </svg>
          </span>
          <span class="btn-text">
            <strong>警告</strong>
            <small>存储空间即将用尽</small>
          </span>
        </button>

        <button type="button" class="trigger-btn t-error" data-type="error">
          <span class="btn-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="m9 9 6 6M15 9l-6 6"></path>
            </svg>
          </span>
          <span class="btn-text">
            <strong>错误</strong>
            <small>网络请求失败重试</small>
          </span>
        </button>
      </div>

      <div class="sub-row">
        <button type="button" class="sub-btn" id="actionToastBtn">带操作按钮的通知</button>
        <button type="button" class="sub-btn" id="burstBtn">连续触发三条</button>
        <button type="button" class="sub-btn ghost" id="clearAllBtn">清空全部通知</button>
      </div>

      <p class="status-line" id="statusLine">通知区域当前为空</p>
    </section>
  </main>

  <div class="toast-region" id="toastRegion" aria-live="polite" aria-label="通知区域"></div>

  <div class="bottom-hint">
    <span class="hint-dot"></span>
    <span class="hint-msg">悬停暂停倒计时 · 点击操作立即处理 · Esc 关闭最新通知</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
