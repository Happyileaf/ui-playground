<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ring Progress · 环形进度</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hud-actions">
    <div class="hud-brand">
      <span class="hud-dot"></span>
      <span class="hud-title">Ring Progress · 环形进度</span>
    </div>
  </div>

  <main class="page-container">
    <header class="page-header">
      <span class="eyebrow">NATIVE COMPONENT · PROGRESS FEEDBACK</span>
      <h1>用一枚圆环交代进度</h1>
      <p>基于 SVG stroke-dashoffset 的环形进度：支持确定值、模拟任务、缓冲轨道与完成态。在圆环上按住并拖动即可直接设定数值，方向键也能微调，读屏器通过下方的进度条角色获取状态。</p>
    </header>

    <section class="stage">
      <div class="ring-wrap" id="ringWrap">
        <svg class="ring" viewBox="0 0 200 200" role="presentation">
          <defs>
            <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fbbf24"></stop>
              <stop offset="100%" stop-color="#fb7185"></stop>
            </linearGradient>
          </defs>
          <circle class="ring-track" cx="100" cy="100" r="84"></circle>
          <circle class="ring-value" id="ringValue" cx="100" cy="100" r="84"></circle>
        </svg>
        <div class="ring-center">
          <span class="ring-percent" id="ringPercent">0</span>
          <span class="ring-state" id="ringState">待开始</span>
        </div>
        <div
          class="ring-knobzone"
          id="knobZone"
          role="slider"
          tabindex="0"
          aria-label="环形进度"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          aria-valuetext="百分之 0"></div>
      </div>

      <div class="controls">
        <button class="ctl-btn primary" id="startBtn" type="button">模拟任务</button>
        <button class="ctl-btn" id="setHalfBtn" type="button">设为 50%</button>
        <button class="ctl-btn ghost" id="resetBtn" type="button">重置</button>
      </div>

      <p class="drag-hint">提示：在圆环上按住拖拽可直接设定数值，键盘聚焦后用 ← → 调整。</p>
    </section>
  </main>

  <div class="bottom-hint">
    <span class="hint-dot"></span>
    <span class="hint-msg">拖动圆环设定 · ← → 微调 · 完成时呈现打勾反馈</span>
  </div>

  <script src="script.js</script>
</body>
</html>
