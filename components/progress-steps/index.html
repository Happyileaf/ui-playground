<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Progress Steps · 步骤进度条</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="hud-brand">
    <span class="hud-dot"></span>
    <span class="hud-title">Progress Steps</span>
  </div>

  <main class="page-container">
    <header class="page-header">
      <span class="eyebrow">Checkout Stepper</span>
      <h1>步骤进度条</h1>
      <p>进度连线弹性生长 · 节点打勾动画 · 点击已完成节点可回退</p>
    </header>

    <section class="steps-card">
      <div class="steps" id="steps">
        <div class="step-node completed" data-index="0">
          <div class="node-circle">
            <svg class="check-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12.5l4.5 4.5L19 7.5" fill="none" />
            </svg>
            <span class="node-num">1</span>
          </div>
          <div class="node-meta">
            <span class="node-title">购物车</span>
            <span class="node-sub">确认商品</span>
          </div>
        </div>

        <div class="step-node active" data-index="1">
          <div class="node-circle">
            <svg class="check-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12.5l4.5 4.5L19 7.5" fill="none" />
            </svg>
            <span class="node-num">2</span>
          </div>
          <div class="node-meta">
            <span class="node-title">填写地址</span>
            <span class="node-sub">收货信息</span>
          </div>
        </div>

        <div class="step-node" data-index="2">
          <div class="node-circle">
            <svg class="check-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12.5l4.5 4.5L19 7.5" fill="none" />
            </svg>
            <span class="node-num">3</span>
          </div>
          <div class="node-meta">
            <span class="node-title">支付方式</span>
            <span class="node-sub">选择渠道</span>
          </div>
        </div>

        <div class="step-node" data-index="3">
          <div class="node-circle">
            <svg class="check-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12.5l4.5 4.5L19 7.5" fill="none" />
            </svg>
            <span class="node-num">4</span>
          </div>
          <div class="node-meta">
            <span class="node-title">完成下单</span>
            <span class="node-sub">订单提交</span>
          </div>
        </div>

        <div class="steps-track" aria-hidden="true">
          <div class="track-bg"></div>
          <div class="track-prog" id="trackProg"></div>
        </div>
      </div>

      <div class="step-panel" id="stepPanel">
        <div class="panel-icon" id="panelIcon">📍</div>
        <h2 class="panel-title" id="panelTitle">第 2 步：填写地址</h2>
        <p class="panel-desc" id="panelDesc">请填写或选择收货地址，确保包裹能准确送达</p>
      </div>

      <div class="step-controls">
        <button class="ctl-btn ghost" id="prevBtn">上一步</button>
        <button class="ctl-btn primary" id="nextBtn">下一步</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
