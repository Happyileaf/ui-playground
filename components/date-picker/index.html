<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Date Picker · 键盘日历选择器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hud-brand">
    <span class="hud-dot"></span>
    <span class="hud-title">Date Picker</span>
  </div>

  <main class="wrap">
    <header class="page-head">
      <span class="eyebrow">FULL KEYBOARD · MIN DATE · FOCUS MANAGED</span>
      <h1>预约日期</h1>
      <p>选择不早于今天的日期。支持 <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 移动、<kbd>PgUp</kbd><kbd>PgDn</kbd> 切月、<kbd>Enter</kbd> 确认、<kbd>Esc</kbd> 关闭。</p>
    </header>

    <section class="form-card">
      <div class="field">
        <label for="dateInput">到店日期</label>
        <div class="date-trigger">
          <svg class="cal-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"></rect><line x1="3" y1="9.5" x2="21" y2="9.5"></line><line x1="8" y1="3" x2="8" y2="6.5"></line><line x1="16" y1="3" x2="16" y2="6.5"></line></svg>
          <input type="text" id="dateInput" readonly placeholder="请选择日期" aria-haspopup="dialog" aria-expanded="false" aria-controls="dpPanel">
          <button type="button" id="clearDate" class="clear-date" aria-label="清除日期" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
          </button>
        </div>
      </div>

      <div class="panel" id="dpPanel" role="dialog" aria-modal="true" aria-label="选择日期" hidden>
        <div class="panel-head">
          <button type="button" class="month-nav" id="prevMonth" aria-label="上个月">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
          <span class="month-label" id="monthLabel"></span>
          <button type="button" class="month-nav" id="nextMonth" aria-label="下个月">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        </div>

        <div class="week-row" aria-hidden="true">
          <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
        </div>

        <div class="day-grid" id="dayGrid" role="grid"></div>

        <div class="panel-foot">
          <button type="button" class="foot-btn" id="todayBtn">今天</button>
          <button type="button" class="foot-btn foot-btn-ghost" id="closeBtn">关闭</button>
        </div>
      </div>

      <p class="result-line" id="resultLine" hidden></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
