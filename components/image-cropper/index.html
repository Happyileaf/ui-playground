<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Cropper · 图片裁剪</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hud-actions">
    <div class="hud-brand">
      <span class="hud-dot"></span>
      <span class="hud-title">Image Cropper · 图片裁剪</span>
    </div>
  </div>

  <main class="page-container">
    <header class="page-header">
      <span class="eyebrow">NATIVE COMPONENT · MEDIA UTILITY</span>
      <h1>框住想要的区域，八个方向随手拉</h1>
      <p>纯原生 Canvas 裁剪器：内置一张示例图，也可替换为本地图片。拖动选框移动、八个手柄缩放，支持自由 / 1:1 / 16:9 / 4:3 比例锁定、九宫格辅助线与缩放微调，确认后在右侧实时导出裁剪结果。</p>
    </header>

    <section class="studio">
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="canvas"></canvas>
        <div class="crop-box" id="cropBox">
          <div class="crop-grid" aria-hidden="true"></div>
          <span class="handle h-nw" data-handle="nw"></span>
          <span class="handle h-n" data-handle="n"></span>
          <span class="handle h-ne" data-handle="ne"></span>
          <span class="handle h-e" data-handle="e"></span>
          <span class="handle h-se" data-handle="se"></span>
          <span class="handle h-s" data-handle="s"></span>
          <span class="handle h-sw" data-handle="sw"></span>
          <span class="handle h-w" data-handle="w"></span>
        </div>
      </div>

      <aside class="side-panel">
        <div class="ratio-group" role="group" aria-label="裁剪比例">
          <button class="ratio-btn is-active" type="button" data-ratio="free">自由</button>
          <button class="ratio-btn" type="button" data-ratio="1">1:1</button>
          <button class="ratio-btn" type="button" data-ratio="1.7778">16:9</button>
          <button class="ratio-btn" type="button" data-ratio="1.3333">4:3</button>
        </div>

        <label class="zoom-row">
          <span class="zoom-label">缩放</span>
          <input type="range" id="zoomRange" min="1" max="2.4" step="0.01" value="1">
          <span class="zoom-val" id="zoomVal">100%</span>
        </label>

        <button class="upload-btn" type="button" id="uploadBtn">替换本地图片</button>
        <input type="file" id="fileInput" accept="image/*" hidden>

        <button class="confirm-btn" type="button" id="confirmBtn">生成裁剪结果</button>

        <div class="preview-box">
          <span class="preview-label">裁剪预览</span>
          <div class="preview-frame" id="previewFrame">
            <span class="preview-empty">尚未生成</span>
          </div>
          <button class="download-btn" type="button" id="downloadBtn" disabled>下载 PNG</button>
        </div>
      </aside>
    </section>
  </main>

  <div class="bottom-hint">
    <span class="hint-dot"></span>
    <span class="hint-msg">拖框移动 · 拉手柄缩放 · 选比例锁定 · 确认生成预览</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
