<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Native UI Buttons</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Modern Native UI Buttons</h1>
      <p>Pure HTML5 + CSS3 + Vanilla JavaScript. No dependencies or build steps required.</p>
    </header>

    <div class="btn-grid">
      <!-- 1. Ripple Effect Button -->
      <div class="card">
        <span class="tag">01. Ripple Wave</span>
        <button class="btn btn-ripple" id="rippleBtn">
          <span>Click For Ripple</span>
        </button>
      </div>

      <!-- 2. Conic Shimmer Border Button -->
      <div class="card">
        <span class="tag">02. Shimmer Border</span>
        <button class="btn btn-shimmer">
          <span class="shimmer-border"></span>
          <span class="btn-inner">Shimmering Glow</span>
        </button>
      </div>

      <!-- 3. Neon Cyberpunk Pulse Button -->
      <div class="card">
        <span class="tag">03. Cyber Neon</span>
        <button class="btn btn-neon">
          <span>Cyber Action</span>
        </button>
      </div>

      <!-- 4. Glassmorphism Button -->
      <div class="card">
        <span class="tag">04. Frosted Glass</span>
        <button class="btn btn-glass">
          <span>Frosted Glass</span>
        </button>
      </div>

      <!-- 5. Slide Fill Button -->
      <div class="card">
        <span class="tag">05. Slide Fill</span>
        <button class="btn btn-slide">
          <span>Hover Slide</span>
        </button>
      </div>

      <!-- 6. 3D Push Button -->
      <div class="card">
        <span class="tag">06. 3D Tactile</span>
        <button class="btn btn-push">
          <span>Push Down</span>
        </button>
      </div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
