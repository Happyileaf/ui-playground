<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fluid Origami Sheet / Peel-Off Note · 动态流体折纸与翻页手势</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- Ambient Backdrop -->
  <div class="desk-backdrop">
    <div class="desk-mat"></div>
    <div class="desk-shadow"></div>
  </div>

  <!-- Main Note Pad Stage -->
  <main class="note-stage" id="noteStage">
    
    <!-- Underlying Base Pad Stack (Depth Illusion) -->
    <div class="pad-stack">
      <div class="pad-layer pad-layer-3"></div>
      <div class="pad-layer pad-layer-2"></div>
      <div class="pad-layer pad-layer-1"></div>
    </div>

    <!-- Active Peelable Paper Sheet Container -->
    <div class="sheet-container" id="sheetContainer">
      <div class="sheet-wrapper" id="sheetWrapper">
        
        <!-- Base Unpeeled Paper (Bottom Face with content) -->
        <div class="paper-base" id="paperBase">
          <div class="paper-texture"></div>
          
          <div class="paper-header">
            <div class="sheet-meta">
              <span class="sheet-id" id="sheetId">NOTE · #042</span>
              <span class="sheet-date" id="sheetDate">2026.09.21</span>
            </div>
            <div class="sheet-pins">
              <span class="sheet-tag">IDEA LOG</span>
            </div>
          </div>

          <div class="paper-content">
            <textarea class="note-editor" id="noteEditor" spellcheck="false" placeholder="在此书写灵感笔记...
• 拖拽任意角落体验流体折叠与卷曲
• 拖拽超出半屏释放即可撕下当前便签
• 纯原生 ES6+ 物理弹性与 Web Audio 纸张音效">◈ 动态流体折纸与翻页手势
────────────────────────
1. 抓住右上角或左下角向中心拖拽，观察无缝折痕与阴影投射；
2. 拖拽距离超过 55% 松开，纸张将伴随物理撕裂音效飘落；
3. 支持实时编辑便签文本与切换和纸、墨黑、牛皮纸材质。</textarea>
          </div>

          <div class="paper-footer">
            <span class="brand-sub">NATIVE TOUCH ENGINE</span>
            <span class="tear-hint">CORNER PEEL ACTIVE</span>
          </div>

          <!-- 4 Corner Interactive Peeling Handles -->
          <div class="peel-handle handle-tr" data-corner="tr" title="按住拖拽卷曲"></div>
          <div class="peel-handle handle-br" data-corner="br" title="按住拖拽卷曲"></div>
          <div class="peel-handle handle-tl" data-corner="tl" title="按住拖拽卷曲"></div>
          <div class="peel-handle handle-bl" data-corner="bl" title="按住拖拽卷曲"></div>
        </div>

        <!-- 3D Curled Flap Face (Peel overlay with gradient shadow) -->
        <div class="peel-overlay" id="peelOverlay">
          <div class="peel-shadow" id="peelShadow"></div>
          <div class="peel-flap" id="peelFlap">
            <div class="flap-back-texture"></div>
            <div class="flap-crease-highlight"></div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Top Floating Controls (Title + Micro-HUD) -->
  <div class="hud-actions">
    <div class="hud-brand" id="hudBrand">
      <span class="hud-dot"></span>
      <span class="hud-title">动态流体折纸与翻页 · FLUID ORIGAMI NOTE</span>
    </div>
    <button type="button" class="btn-tool btn-icon-only" id="btnToggleHud" title="隐藏/显示控制台 (H)" aria-label="切换控制面板">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
  </div>

  <!-- Floating Parametric Controller Panel (HUD) -->
  <aside class="control-dock hidden" id="controlDock">
    <div class="dock-header">
      <span class="dock-heading">纸张流体折纸物理控制台</span>
      <span class="dock-shortcut">按 H 收起</span>
    </div>

    <!-- Quick Operations -->
    <div class="control-section">
      <label class="control-label">纸张手势与动作</label>
      <div class="dock-quick-actions">
        <button type="button" class="btn-dock-action" id="btnTearSheet" title="撕下当前便签纸">
          <span class="tool-icon">✂️</span>
          <span class="tool-label">物理撕下</span>
        </button>
        <button type="button" class="btn-dock-action" id="btnNewSheet" title="换一张全新便签">
          <span class="tool-icon">📝</span>
          <span class="tool-label">新建便签</span>
        </button>
        <button type="button" class="btn-dock-action" id="btnToggleSound" title="开启/关闭纸张摩擦音效">
          <span class="tool-icon" id="soundIcon">🔈</span>
          <span class="tool-label" id="soundLabel">纸张音效: 关</span>
        </button>
        <button type="button" class="btn-dock-action" id="btnAutoPeelDemo" title="演示角落卷曲回弹">
          <span class="tool-icon">✨</span>
          <span class="tool-label">卷角演示</span>
        </button>
      </div>
    </div>

    <!-- Paper Texture & Material Preset -->
    <div class="control-section">
      <label class="control-label">纸张材质质感 (Paper Texture)</label>
      <div class="palette-grid">
        <button type="button" class="shape-chip active" data-texture="noir">
          <span class="palette-swatch" style="background: linear-gradient(135deg, #1e293b, #0f172a);"></span>
          <span>极简墨黑</span>
        </button>
        <button type="button" class="shape-chip" data-texture="washi">
          <span class="palette-swatch" style="background: linear-gradient(135deg, #f8fafc, #e2e8f0);"></span>
          <span>和纸方格</span>
        </button>
        <button type="button" class="shape-chip" data-texture="sakura">
          <span class="palette-swatch" style="background: linear-gradient(135deg, #fdf2f8, #fbcfe8);"></span>
          <span>东京落樱</span>
        </button>
        <button type="button" class="shape-chip" data-texture="kraft">
          <span class="palette-swatch" style="background: linear-gradient(135deg, #d97706, #92400e);"></span>
          <span>原色牛皮</span>
        </button>
      </div>
    </div>

    <!-- Sliders -->
    <div class="control-section">
      <div class="slider-row">
        <div class="slider-info">
          <span class="slider-label">纸张弹性阻尼 (Spring Snappiness)</span>
          <span class="slider-val" id="stiffnessVal">0.18</span>
        </div>
        <input type="range" id="stiffnessRange" min="0.08" max="0.35" step="0.02" value="0.18">
      </div>

      <div class="slider-row">
        <div class="slider-info">
          <span class="slider-label">折痕阴影深度 (Crease Shadow)</span>
          <span class="slider-val" id="shadowVal">80%</span>
        </div>
        <input type="range" id="shadowRange" min="20" max="100" step="5" value="80">
      </div>

      <div class="slider-row">
        <div class="slider-info">
          <span class="slider-label">撕下触发阈值 (Tear Threshold)</span>
          <span class="slider-val" id="tearThreshVal">55%</span>
        </div>
        <input type="range" id="tearThreshRange" min="35" max="80" step="5" value="55">
      </div>
    </div>

    <div class="dock-footer">
      <button type="button" class="btn-reset" id="btnResetParams">重置默认参数</button>
    </div>
  </aside>

  <!-- Bottom Interactive Helper Hint -->
  <div class="bottom-hint" id="bottomHint">
    <span class="hint-dot"></span>
    <span class="hint-msg">拖拽卡片任意角落体验卷曲撕纸 · 释放归位或撕下 · 按 H 切换控制台</span>
  </div>

  <script src="./script.js"></script>
</body>
</html>
