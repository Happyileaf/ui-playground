<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emoji Rating · 表情满意度评分</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="hud-brand">
    <span class="hud-dot"></span>
    <span class="hud-title">Emoji Rating</span>
  </div>

  <main class="page-container">
    <header class="page-header">
      <span class="eyebrow">Feedback Widget</span>
      <h1>表情满意度评分</h1>
      <p>悬停预览 · 点击选择 · 支持 ← → 方向键与 1–5 数字键</p>
    </header>

    <section class="rating-card" id="ratingCard">
      <div class="card-face" id="cardFace">
        <h2 class="question">本次使用体验如何？</h2>

        <div class="track-wrap">
          <div class="track-fill" id="trackFill"></div>
        </div>

        <div class="emoji-row" id="emojiRow" role="radiogroup" aria-label="满意度评分">
          <button class="emoji-btn" data-value="1" role="radio" aria-checked="false" aria-label="很不满意">
            <span class="emoji">😡</span>
          </button>
          <button class="emoji-btn" data-value="2" role="radio" aria-checked="false" aria-label="不太满意">
            <span class="emoji">😕</span>
          </button>
          <button class="emoji-btn" data-value="3" role="radio" aria-checked="false" aria-label="一般">
            <span class="emoji">😐</span>
          </button>
          <button class="emoji-btn" data-value="4" role="radio" aria-checked="false" aria-label="满意">
            <span class="emoji">🙂</span>
          </button>
          <button class="emoji-btn" data-value="5" role="radio" aria-checked="false" aria-label="非常满意">
            <span class="emoji">🤩</span>
          </button>
        </div>

        <p class="verdict" id="verdict">请选择评分</p>

        <button class="submit-btn" id="submitBtn" disabled>提交评价</button>
      </div>

      <div class="card-success" id="cardSuccess">
        <div class="success-badge">
          <svg viewBox="0 0 52 52" width="56" height="56" aria-hidden="true">
            <circle class="suc-circle" cx="26" cy="26" r="24" fill="none" />
            <path class="suc-check" fill="none" d="M14 27l8 8 16-17" />
          </svg>
        </div>
        <h2 class="success-title" id="successTitle">感谢你的反馈！</h2>
        <p class="success-sub" id="successSub">我们会认真对待每一条评价</p>
        <button class="again-btn" id="againBtn">重新评价</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
