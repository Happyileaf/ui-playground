<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Piano Keyboard · 交互式钢琴键盘</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- HUD Brand Title -->
  <div class="hud-brand">
    <span class="hud-dot"></span>
    <span class="hud-title">Piano Keyboard</span>
    <button class="hud-toggle" id="hudToggle" title="Toggle Controls (H)">⚙️</button>
  </div>

  <!-- Micro-HUD Control Panel -->
  <div class="control-dock hidden" id="controlDock">
    <div class="control-group">
      <label for="octaveRange">Octave Range: <span id="octaveValue">2</span></label>
      <input type="range" id="octaveRange" min="1" max="4" value="2">
    </div>
    <div class="control-group">
      <label for="sustain">Sustain: <span id="sustainValue">50%</span></label>
      <input type="range" id="sustain" min="0" max="100" value="50">
    </div>
    <div class="control-group">
      <label for="waveform">Waveform:</label>
      <select id="waveform">
        <option value="sine">Sine</option>
        <option value="square">Square</option>
        <option value="sawtooth">Sawtooth</option>
        <option value="triangle">Triangle</option>
      </select>
    </div>
  </div>

  <!-- Piano Container -->
  <div class="piano-container" id="pianoContainer">
    <!-- Keys will be generated by JavaScript -->
  </div>

  <script src="./script.js"></script>
</body>
</html>
