<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notification Center · 通知中心</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">◈</span>
    <span class="brand-name">Nimbus</span>
  </div>
  <div class="topbar-right">
    <button id="bellBtn" class="bell-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="通知">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <span id="unreadBadge" class="unread-badge" hidden>0</span>
    </button>
  </div>
</header>

<main class="page">
  <section class="card">
    <p class="card-eyebrow">COMPONENT · FEEDBACK</p>
    <h1 class="card-title">Notification Center</h1>
    <p class="card-desc">一个克制、安静的下拉通知中心。点击右上角铃铛展开通知面板，所有状态均在本地实时更新。</p>
    <ul class="hint-list">
      <li><span>筛选</span>在「全部 / 未读」之间切换，快速定位待处理消息</li>
      <li><span>单条已读</span>点击任意通知即标记为已读，徽标数字同步减少</li>
      <li><span>全部已读</span>一键清空所有未读，右上角红点随之消失</li>
      <li><span>关闭</span>按 Esc 键或点击面板外部任意区域即可收起</li>
    </ul>
  </section>
</main>

<div id="notifPanel" class="notif-panel" role="dialog" aria-label="通知面板">
  <div class="panel-head">
    <h2 class="panel-title">通知</h2>
    <button id="markAllBtn" class="text-btn" type="button">全部已读</button>
  </div>
  <div class="filters" role="group" aria-label="通知筛选">
    <button class="pill is-active" type="button" data-filter="all">全部</button>
    <button class="pill" type="button" data-filter="unread">未读</button>
  </div>
  <ul id="notifList" class="notif-list"></ul>
  <div id="emptyState" class="empty-state" hidden>暂无通知</div>
</div>

<div class="hud-brand">
  <span class="hud-dot"></span>
  <span class="hud-title">Notification Center</span>
</div>

<script src="script.js"></script>
</body>
</html>
