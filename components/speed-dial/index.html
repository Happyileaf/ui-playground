<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speed Dial · 悬浮快捷操作</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hud-actions">
    <div class="hud-brand">
      <span class="hud-dot"></span>
      <span class="hud-title">Speed Dial · 悬浮快捷操作</span>
    </div>
  </div>

  <main class="page-container">
    <header class="page-header">
      <span class="eyebrow">NATIVE COMPONENT · FLOATING ACTION</span>
      <h1>把高频操作收进一枚悬浮按钮</h1>
      <p>点击右下角主按钮，动作项会沿设定方向依次弹性展开；再次点击、按 Esc 或点击空白处即可收起。支持 Tab 聚焦与回车/空格触发，展开时焦点自动落入第一个动作。</p>
    </header>

    <section class="demo-card">
      <div class="demo-row">
        <span class="demo-label">展开方向</span>
        <div class="seg-group" role="group" aria-label="展开方向">
          <button type="button" class="seg-btn is-active" data-dir="up">上</button>
          <button type="button" class="seg-btn" data-dir="left">左</button>
          <button type="button" class="seg-btn" data-dir="fan">扇形</button>
        </div>
      </div>
      <div class="demo-log" id="actionLog" aria-live="polite">
        <span class="log-placeholder">尚未选择动作</span>
      </div>
    </section>
  </main>

  <div class="speed-dial" id="speedDial">
    <ul class="dial-list" id="dialList" role="menu" aria-label="快捷操作">
      <li class="dial-item" role="none">
        <button class="dial-action" type="button" role="menuitem" data-label="新建文档" style="--i:0">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
        </button>
        <span class="dial-tip">新建文档</span>
      </li>
      <li class="dial-item" role="none">
        <button class="dial-action" type="button" role="menuitem" data-label="上传图片" style="--i:1">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        </button>
        <span class="dial-tip">上传图片</span>
      </li>
      <li class="dial-item" role="none">
        <button class="dial-action" type="button" role="menuitem" data-label="添加联系人" style="--i:2">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="19" y1="8" x2="19" y2="14"></line><line x1="22" y1="11" x2="16" y2="11"></line></svg>
        </button>
        <span class="dial-tip">添加联系人</span>
      </li>
      <li class="dial-item" role="none">
        <button class="dial-action" type="button" role="menuitem" data-label="发起会议" style="--i:3">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
        </button>
        <span class="dial-tip">发起会议</span>
      </li>
    </ul>
    <button class="dial-fab" id="dialFab" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="展开快捷操作">
      <svg class="icon-plus" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>
  </div>

  <div class="bottom-hint">
    <span class="hint-dot"></span>
    <span class="hint-msg">点击主按钮展开 · Esc / 点击空白收起 · 动作项支持 Tab 与回车</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
