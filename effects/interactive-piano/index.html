<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Piano Keyboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hud-brand">
    <div class="hud-dot"></div>
    <div class="hud-title">Interactive Piano</div>
  </div>

  <div class="piano-container">
    <div class="piano-header">
      <h1>🎹 Interactive Piano Keyboard</h1>
      <p>Click keys or use your keyboard to play!</p>
    </div>
    <div class="piano" id="piano"></div>
    <div class="controls">
      <label>
        <input type="checkbox" id="toggleLabels"> Show Key Labels
      </label>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
