<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Web Audio Piano</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hud-brand">
    <span class="hud-dot"></span>
    <span class="hud-title">Interactive Piano</span>
    <button class="hud-toggle" id="hudToggle" title="Toggle Controls (H)">⚙️</button>
  </div>

  <div class="control-dock hidden" id="controlDock">
    <div class="control-group">
      <label for="waveformSelect">Waveform:</label>
      <select id="waveformSelect">
        <option value="sine">Sine</option>
        <option value="triangle">Triangle</option>
        <option value="square">Square</option>
        <option value="sawtooth">Sawtooth</option>
      </select>
    </div>
    <div class="control-group">
      <label for="detuneSlider">Detune: <span id="detuneValue">0</span> cents</label>
      <input type="range" id="detuneSlider" min="-100" max="100" value="0">
    </div>
    <div class="control-group">
      <label for="releaseSlider">Release: <span id="releaseValue">0.2</span>s</label>
      <input type="range" id="releaseSlider" min="0.05" max="1.5" step="0.05" value="0.2">
    </div>
  </div>

  <div class="piano-container" id="pianoContainer">
    <!-- Piano keys will be generated by JavaScript -->
  </div>

  <script src="script.js"></script>
</body>
</html>
