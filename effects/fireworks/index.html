<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Fireworks Effect</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="controls">
    <button id="autoToggle" class="control-btn active">Auto Launch: ON</button>
    <button id="soundToggle" class="control-btn">Sound: OFF</button>
    <button id="clearBtn" class="control-btn">Clear Canvas</button>
    <span class="hint">Click or drag anywhere to launch fireworks</span>
  </div>
  <canvas id="fireworksCanvas"></canvas>

  <script src="./script.js"></script>
</body>
</html>
