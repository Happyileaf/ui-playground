<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Fireworks · 璀璨焰火粒子特效</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- Fullscreen Interactive Canvas -->
  <canvas id="fireworksCanvas"></canvas>

  <!-- Ambient Backdrop Grain & Vignette Overlay -->
  <div class="canvas-vignette"></div>

  <!-- Top Floating Controls -->
  <div class="hud-actions">
    <div class="hud-brand" id="hudBrand">
      <span class="hud-dot"></span>
      <span class="hud-title">盛典烟花 · FIREWORKS</span>
    </div>
    <button type="button" class="btn-tool btn-icon-only" id="btnToggleHud" title="隐藏/显示控制台 (H)" aria-label="切换控制面板">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
  </div>

  <!-- Floating Parametric Controller Panel (HUD) -->
  <aside class="control-dock hidden" id="controlDock">
    <div class="dock-header">
      <span class="dock-heading">绚烂烟花物理调谐器</span>
      <span class="dock-shortcut">按 H 收起</span>
    </div>

    <!-- Quick Operations Inside Panel -->
    <div class="control-section">
      <label class="control-label">快捷演进操控</label>
      <div class="dock-quick-actions">
        <button type="button" class="btn-dock-action active" id="btnAutoLaunch" title="切换夜空自动连续发射" aria-label="切换自动发射">
          <span class="tool-icon">⚡</span>
          <span class="tool-label" id="autoLaunchLabel">自动连发: 开</span>
        </button>
        <button type="button" class="btn-dock-action" id="btnToggleSound" title="开启/关闭拟真燃放音效" aria-label="切换燃放音效">
          <span class="tool-icon" id="soundIcon">🔈</span>
          <span class="tool-label" id="soundLabel">燃放音效: 关</span>
        </button>
        <button type="button" class="btn-dock-action" id="barrageBtn" title="同时向夜空发射 5 发礼花" aria-label="齐发五枚">
          <span class="tool-icon">🚀</span>
          <span class="tool-label">齐发五枚</span>
        </button>
        <button type="button" class="btn-dock-action" id="clearBtn" title="清空当前夜空上的所有粒子" aria-label="清空夜空">
          <span class="tool-icon">🧹</span>
          <span class="tool-label">清空夜空</span>
        </button>
      </div>
    </div>

    <!-- Bloom Shape Selector -->
    <div class="control-section">
      <label class="control-label">绽放形态 (Bloom Shape)</label>
      <div class="palette-grid">
        <button type="button" class="shape-chip active" data-shape="classic">
          <span class="tool-icon">✦</span>
          <span>经典散布</span>
        </button>
        <button type="button" class="shape-chip" data-shape="heart">
          <span class="tool-icon">♥</span>
          <span>浪漫爱心</span>
        </button>
        <button type="button" class="shape-chip" data-shape="ring">
          <span class="tool-icon">◎</span>
          <span>同心光环</span>
        </button>
        <button type="button" class="shape-chip" data-shape="spiral">
          <span class="tool-icon">🌀</span>
          <span>旋转漩涡</span>
        </button>
        <button type="button" class="shape-chip" data-shape="willow">
          <span class="tool-icon">❊</span>
          <span>垂柳繁星</span>
        </button>
      </div>
    </div>

    <!-- Palette Preset Selector -->
    <div class="control-section">
      <label class="control-label">色彩主题光谱 (Color Spectrum)</label>
      <div class="palette-grid">
        <button type="button" class="palette-chip active" data-palette="rainbow">
          <span class="palette-swatch" style="background: linear-gradient(135deg, #f43f5e, #38bdf8, #a855f7);"></span>
          <span>缤纷全彩</span>
        </button>
        <button type="button" class="palette-chip" data-palette="gold">
          <span class="palette-swatch" style="background: linear-gradient(135deg, #f59e0b, #fef08a);"></span>
          <span>华丽鎏金</span>
        </button>
        <button type="button" class="palette-chip" data-palette="cyber">
          <span class="palette-swatch" style="background: linear-gradient(135deg, #06b6d4, #ec4899);"></span>
          <span>赛博霓虹</span>
        </button>
        <button type="button" class="palette-chip" data-palette="aurora">
          <span class="palette-swatch" style="background: linear-gradient(135deg, #10b981, #3b82f6);"></span>
          <span>极光碧蓝</span>
        </button>
        <button type="button" class="palette-chip" data-palette="crimson">
          <span class="palette-swatch" style="background: linear-gradient(135deg, #ef4444, #f97316);"></span>
          <span>炽烈焰火</span>
        </button>
      </div>
    </div>

    <!-- Sliders -->
    <div class="control-section">
      <div class="slider-row">
        <div class="slider-info">
          <span class="slider-label">粒子密度 (Particles)</span>
          <span class="slider-val" id="particleCountVal">60 颗</span>
        </div>
        <input type="range" id="particleCountRange" min="25" max="150" step="5" value="60">
      </div>

      <div class="slider-row">
        <div class="slider-info">
          <span class="slider-label">尾迹留光 (Trail Decay)</span>
          <span class="slider-val" id="trailDecayVal">适中</span>
        </div>
        <input type="range" id="trailDecayRange" min="1" max="5" step="1" value="3">
      </div>

      <div class="slider-row">
        <div class="slider-info">
          <span class="slider-label">重力引力 (Gravity)</span>
          <span class="slider-val" id="gravityVal">1.0x</span>
        </div>
        <input type="range" id="gravityRange" min="0.4" max="1.8" step="0.1" value="1.0">
      </div>
    </div>

    <div class="dock-footer">
      <button type="button" class="btn-reset" id="btnResetParams">重置默认参数</button>
    </div>
  </aside>

  <!-- Bottom Interactive Helper Hint -->
  <div class="bottom-hint" id="bottomHint">
    <span class="hint-dot"></span>
    <span class="hint-msg">点击夜空发射礼花 · 拖拽连续绽放 · 按 H 切换控制台</span>
  </div>

  <script src="./script.js"></script>
</body>
</html>
