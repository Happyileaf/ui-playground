<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Waves Background</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="hud-brand">
    <span class="hud-dot"></span>
    <span class="hud-text">Animated Waves</span>
  </div>

  <div class="control-dock hidden">
    <button class="gear-toggle" id="gearToggle" aria-label="Toggle Controls">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
    <div class="controls-panel">
      <div class="control-row">
        <label for="amplitude">Amplitude: <span id="amplitudeValue">40</span></label>
        <input type="range" id="amplitude" min="10" max="100" value="40">
      </div>
      <div class="control-row">
        <label for="frequency">Frequency: <span id="frequencyValue">3</span></label>
        <input type="range" id="frequency" min="1" max="10" step="0.5" value="3">
      </div>
      <div class="control-row">
        <label for="speed">Speed: <span id="speedValue">2</span></label>
        <input type="range" id="speed" min="0.5" max="5" step="0.5" value="2">
      </div>
      <div class="control-row">
        <label for="layers">Layers: <span id="layersValue">3</span></label>
        <input type="range" id="layers" min="1" max="5" step="1" value="3">
      </div>
    </div>
  </div>

  <canvas id="canvas"></canvas>
  <script src="./script.js"></script>
</body>
</html>
