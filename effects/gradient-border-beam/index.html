<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gradient Border Beam</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="container">
    <div class="demo-grid">
      <div class="gradient-border-card">
        <div class="card-content">
          <h3>Animated Gradient Border</h3>
          <p>Continuously rotating gradient beam with smooth easing</p>
        </div>
      </div>

      <div class="gradient-border-card small">
        <div class="card-content">
          <h3>Small Card</h3>
          <p>Responsive sizing works at any dimension</p>
        </div>
      </div>

      <div class="gradient-border-card circle">
        <div class="card-content">
          <span>⚡</span>
          <p>Round Shape Support</p>
        </div>
      </div>

      <div class="gradient-border-card square">
        <div class="card-content">
          <div class="icon-box">✦</div>
          <h4>Geometric Beauty</h4>
          <p>Pure CSS gradient rotation with pseudo-element overlay</p>
        </div>
      </div>
    </div>
  </div>
  <script src="./script.js"></script>
</body>
</html>
