<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glitch Text - UI Playground</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1 id="glitchCanvas" class="glitch-text">GLITCH</h1>
    <p class="subtitle">Interactive Text Glitch Effect</p>
    <div class="controls">
      <label>
        Intensity:
        <input type="range" id="intensitySlider" min="0" max="10" value="3" step="0.1">
        <span id="intensityValue">3.0</span>
      </label>
      <label>
        Speed:
        <input type="range" id="speedSlider" min="0" max="1" value="0.5" step="0.01">
        <span id="speedValue">0.5</span>
      </label>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
