<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glitch Text - UI Playground</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="hud-brand">
    <span class="hud-dot"></span>
    <span class="hud-title">Glitch Text</span>
    <button class="hud-toggle" id="hudToggle" aria-label="Toggle Controls">⚙️</button>
  </div>

  <div class="control-dock hidden" id="controlDock">
    <div class="control-item">
      <label for="speedRange">Speed: <span id="speedValue">0.5</span></label>
      <input type="range" id="speedRange" min="0" max="1" step="0.05" value="0.5">
    </div>
    <div class="control-item">
      <label for="intensityRange">Intensity: <span id="intensityValue">0.3</span></label>
      <input type="range" id="intensityRange" min="0" max="1" step="0.05" value="0.3">
    </div>
    <div class="control-item">
      <label for="frequencyRange">Frequency: <span id="frequencyValue">0.15</span></label>
      <input type="range" id="frequencyRange" min="0" max="0.5" step="0.01" value="0.15">
    </div>
    <div class="control-item">
      <label for="colorCheckbox">Color Shift: <input type="checkbox" id="colorCheckbox" checked></label>
    </div>
  </div>

  <main class="glitch-container">
    <h1 class="glitch-text" id="glitchText">GLITCH<br>PLAYGROUND</h1>
  </main>

  <script src="./script.js"></script>
</body>
</html>
