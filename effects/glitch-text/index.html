<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glitch Text - UI Playground</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hud-brand">
    <span class="hud-dot"></span>
    <span class="hud-title">Glitch Text</span>
  </div>

  <div class="container">
    <h1 id="glitchText" class="glitch-text">GLITCH</h1>
    <div class="controls">
      <label>
        Intensity:
        <input type="range" id="intensitySlider" min="0" max="10" value="3" step="0.5">
        <span id="intensityValue">3</span>
      </label>
      <label>
        Speed:
        <input type="range" id="speedSlider" min="1" max="100" value="30" step="1">
        <span id="speedValue">30</span>
      </label>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
