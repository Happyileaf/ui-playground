<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glitch Text</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="container">
    <div class="hud-brand">
      <span class="hud-dot"></span>
      <span class="hud-title">Glitch Text</span>
      <button class="hud-toggle" title="Toggle Controls (H/Esc)">⚙️</button>
    </div>

    <div class="control-dock hidden">
      <div class="control-group">
        <label for="intensity">Intensity: <span id="intensityValue">0.5</span></label>
        <input type="range" id="intensity" min="0" max="1" step="0.05" value="0.5">
      </div>
      <div class="control-group">
        <label for="speed">Speed: <span id="speedValue">0.5</span></label>
        <input type="range" id="speed" min="0" max="1" step="0.05" value="0.5">
      </div>
      <div class="control-group">
        <label for="colorShift">Color Shift: <span id="colorShiftValue">On</span></label>
        <input type="checkbox" id="colorShift" checked>
      </div>
    </div>

    <div class="glitch-container">
      <h1 id="glitchText" data-text="GLITCH">GLITCH</h1>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
