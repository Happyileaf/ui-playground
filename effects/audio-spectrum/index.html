<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Spectrum - UI Playground</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hud-brand">
    <span class="hud-dot"></span>
    <span class="hud-title">Audio Spectrum</span>
  </div>

  <div class="container">
    <canvas id="canvas"></canvas>
    <div class="controls">
      <button id="toggleBtn">Play / Pause</button>
      <div class="slider-group">
        <label>
          Sensitivity:
          <input type="range" id="sensitivitySlider" min="0.1" max="5" value="1.5" step="0.1">
          <span id="sensitivityValue">1.5</span>
        </label>
        <label>
          Bar Width:
          <input type="range" id="barWidthSlider" min="2" max="10" value="5" step="1">
          <span id="barWidthValue">5</span>
        </label>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
