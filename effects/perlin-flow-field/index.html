<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perlin Flow Field - UI Playground</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="controls">
    <div class="control-row">
      <label for="particleCount">Particles: <span id="particleCountValue">3000</span></label>
      <input type="range" id="particleCount" min="500" max="8000" value="3000" step="100">
    </div>
    <div class="control-row">
      <label for="noiseScale">Noise Scale: <span id="noiseScaleValue">0.005</span></label>
      <input type="range" id="noiseScale" min="0.001" max="0.02" value="0.005" step="0.001">
    </div>
    <div class="control-row">
      <label for="speed">Flow Speed: <span id="speedValue">1.0</span></label>
      <input type="range" id="speed" min="0.1" max="3.0" value="1.0" step="0.1">
    </div>
    <button id="resetBtn">Reset Flow</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
