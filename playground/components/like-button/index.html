<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heart Burst · 双击点赞</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="hud-brand">
    <span class="hud-dot"></span>
    <span class="hud-title">Heart Burst · 双击点赞</span>
  </div>

  <main class="feed">
    <article class="post-card">
      <header class="post-head">
        <div class="author-avatar" aria-hidden="true">L</div>
        <div class="author-meta">
          <span class="author-name">Lumen Studio</span>
          <span class="author-time">2 小时前</span>
        </div>
        <button class="more-btn" type="button" aria-label="更多选项">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
        </button>
      </header>

      <div class="media" id="media">
        <div class="media-art" aria-hidden="true"></div>
        <svg class="big-heart" id="bigHeart" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
        <div class="burst-layer" id="burstLayer" aria-hidden="true"></div>
        <span class="media-hint">双击图片点赞</span>
      </div>

      <footer class="post-actions">
        <button class="action like-btn" id="likeBtn" type="button" aria-pressed="false" aria-label="点赞">
          <svg class="heart-ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
          <span class="like-count" id="likeCount">1,204</span>
        </button>

        <button class="action" type="button" aria-label="评论">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          <span>88</span>
        </button>

        <button class="action" type="button" aria-label="分享">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          <span>分享</span>
        </button>

        <button class="action bookmark" type="button" aria-label="收藏">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        </button>
      </footer>

      <p class="post-caption"><strong>lumen.studio</strong> 晨雾里的光影练习，双击留下你的心意 ❤️</p>
    </article>
  </main>

  <script src="script.js"></script>
</body>
</html>
