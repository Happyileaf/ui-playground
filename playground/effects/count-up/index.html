<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Count Up · 数字滚动</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hud-actions">
    <div class="hud-brand">
      <span class="hud-dot"></span>
      <span class="hud-title">Count Up · 数字滚动</span>
    </div>
  </div>

  <main class="page-container">
    <header class="page-header">
      <span class="eyebrow">NATIVE EFFECT · DATA IN MOTION</span>
      <h1>数字一路奔涌，稳稳落在答案上</h1>
      <p>基于 requestAnimationFrame 与 easeOutExpo 的数字滚动特效：指标卡片滚入视口时，数值从 0 高速爬升、尾部柔和减速并定格；支持千分位、小数位与前缀后缀，每个数字独立计时，重播按钮可反复观赏。</p>
    </header>

    <section class="stage">
      <div class="stat-grid">
        <article class="stat-card">
          <span class="stat-icon">★</span>
          <div class="stat-number" data-target="1286" data-duration="1800" data-decimals="0">0</div>
          <span class="stat-label">累计收藏</span>
        </article>

        <article class="stat-card accent">
          <span class="stat-icon">↗</span>
          <div class="stat-number" data-target="98.6" data-duration="2000" data-decimals="1" data-suffix="%">0</div>
          <span class="stat-label">好评率</span>
        </article>

        <article class="stat-card">
          <span class="stat-icon">◈</span>
          <div class="stat-number" data-target="45200" data-duration="2200" data-decimals="0" data-separator="true">0</div>
          <span class="stat-label">运行次数</span>
        </article>

        <article class="stat-card accent">
          <span class="stat-icon">⏱</span>
          <div class="stat-number" data-target="3.14" data-duration="1600" data-decimals="2" data-prefix="π ≈ ">0</div>
          <span class="stat-label">圆周常数</span>
        </article>
      </div>

      <button class="replay-btn" id="replayBtn" type="button">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        <span>重播动画</span>
      </button>
    </section>
  </main>

  <div class="bottom-hint">
    <span class="hint-dot"></span>
    <span class="hint-msg">滚动或点击重播 · 数字以 easeOutExpo 曲线从 0 爬升</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
